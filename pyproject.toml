[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "seoforge"
version = "0.2.1"
description = "Evidence-first SEO, AEO and GEO toolkit with a native website crawler."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{name = "SeoForge Contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "colorama>=0.4.6,<0.5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "tomli>=2.0,<3; python_version < '3.11'",
]
keywords = ["seo", "aeo", "geo", "crawler", "backlinks", "reputation", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
reports = ["reportlab>=4.2,<5"]
sftp = ["paramiko>=3.4,<5"]
dev = ["ruff>=0.11,<1", "reportlab>=4.2,<5", "pypdf>=5,<7", "pytest>=8,<9"]
hosting-test = ["paramiko>=3.4,<5", "pyftpdlib>=2,<3", "pyOpenSSL>=24,<27"]
all = ["seoforge[browser,reports,sftp]"]

[project.scripts]
seoforge = "seoforge.cli.main:main"

[project.urls]
Repository = "https://github.com/NisarZaidi/seoforge"
Documentation = "https://github.com/NisarZaidi/seoforge/blob/main/docs/README.md"
Issues = "https://github.com/NisarZaidi/seoforge/issues"
Changelog = "https://github.com/NisarZaidi/seoforge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seoforge = ["report/assets/*.png", "report/assets/*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
